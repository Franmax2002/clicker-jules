<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Clicker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #2c3e50, #4ca1af);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      user-select: none;
      overflow: hidden;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 2.5rem 3rem;
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      max-width: 400px;
      width: 90%;
      position: relative;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .counter-container {
      margin: 1.5rem 0;
    }

    .counter-label {
      font-size: 1.1rem;
      opacity: 0.9;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .counter-value {
      font-size: 3.5rem;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 0 3px 6px rgba(0, 0, 0, 0.4);
      margin-top: 0.2rem;
    }

    .cookie-wrapper {
      position: relative;
      margin: 2rem auto;
      display: inline-block;
      cursor: pointer;
      outline: none;
    }

    .cookie-svg {
      width: 200px;
      height: 200px;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.4));
      transition: transform 0.1s ease-in-out, filter 0.1s ease-in-out;
    }

    .cookie-wrapper:hover .cookie-svg {
      transform: scale(1.05);
      filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.5));
    }

    .cookie-wrapper:active .cookie-svg {
      transform: scale(0.95);
    }

    .floating-text {
      position: absolute;
      font-weight: bold;
      font-size: 1.5rem;
      color: #ffd700;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-60px) scale(1.2);
      }
    }

    .btn-reset {
      margin-top: 1rem;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 0.6rem 1.4rem;
      border-radius: 25px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-reset:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: translateY(-2px);
    }

    .btn-reset:active {
      transform: translateY(0);
    }

    /* Achievements / Logros Styling */
    .achievements-section {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .achievements-title {
      font-size: 1.2rem;
      margin-bottom: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .achievements-grid {
      display: flex;
      justify-content: space-around;
      gap: 0.5rem;
    }

    .achievement-card {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 0.6rem 0.4rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
      opacity: 0.4;
      filter: grayscale(100%);
    }

    .achievement-card.unlocked {
      opacity: 1;
      filter: grayscale(0%);
      background: rgba(255, 215, 0, 0.15);
      border-color: rgba(255, 215, 0, 0.5);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }

    .trophy-icon {
      width: 36px;
      height: 36px;
      margin-bottom: 0.3rem;
    }

    .achievement-name {
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 0.1rem;
    }

    .achievement-req {
      font-size: 0.65rem;
      opacity: 0.8;
    }

    /* Achievement toast / popup notification */
    .toast-notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(20, 20, 30, 0.95);
      border: 2px solid #ffd700;
      color: #fff;
      padding: 1rem 1.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      gap: 1rem;
      transform: translateX(150%);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
    }

    .toast-notification.show {
      transform: translateX(0);
    }

    .toast-icon {
      width: 40px;
      height: 40px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Cookie Clicker</h1>

    <div class="counter-container">
      <div class="counter-label">Cookies Clicked</div>
      <div class="counter-value" id="cookie-count">0</div>
    </div>

    <div class="cookie-wrapper" id="cookie-btn" role="button" tabindex="0" aria-label="Click the cookie">
      <svg class="cookie-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Cookie Base -->
        <circle cx="100" cy="100" r="90" fill="#d49b59" stroke="#b07a3e" stroke-width="6"/>

        <!-- Texture details -->
        <circle cx="100" cy="100" r="82" fill="none" stroke="#c48a48" stroke-width="3" stroke-dasharray="10 15"/>

        <!-- Chocolate Chips -->
        <circle cx="60" cy="60" r="12" fill="#4a2c11"/>
        <circle cx="135" cy="65" r="14" fill="#4a2c11"/>
        <circle cx="100" cy="110" r="15" fill="#4a2c11"/>
        <circle cx="65" cy="140" r="11" fill="#4a2c11"/>
        <circle cx="140" cy="130" r="13" fill="#4a2c11"/>
        <circle cx="105" cy="50" r="10" fill="#4a2c11"/>
        <circle cx="160" cy="95" r="9" fill="#4a2c11"/>
        <circle cx="45" cy="105" r="10" fill="#4a2c11"/>
        <circle cx="105" cy="160" r="11" fill="#4a2c11"/>

        <!-- Highlights on Chocolate Chips -->
        <circle cx="57" cy="57" r="3" fill="#6d451e"/>
        <circle cx="132" cy="62" r="3.5" fill="#6d451e"/>
        <circle cx="97" cy="107" r="4" fill="#6d451e"/>
        <circle cx="63" cy="138" r="2.5" fill="#6d451e"/>
        <circle cx="137" cy="127" r="3" fill="#6d451e"/>
      </svg>
    </div>

    <div>
      <button class="btn-reset" id="reset-btn">Reset Counter</button>
    </div>

    <!-- Achievements / Logros Section -->
    <div class="achievements-section" id="achievements-section">
      <div class="achievements-title">Logros 🏆</div>
      <div class="achievements-grid">

        <!-- 10 Clicks Achievement -->
        <div class="achievement-card" id="achievement-10" data-clicks="10" aria-label="Logro 10 Clicks">
          <svg class="trophy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9C6 9 3 9 3 6C3 3 6 3 6 3H18C18 3 21 3 21 6C21 9 18 9 18 9" stroke="#cd7f32" fill="#cd7f32" fill-opacity="0.3"/>
            <path d="M6 3H18V10C18 13.3137 15.3137 16 12 16C8.68629 16 6 13.3137 6 10V3Z" stroke="#cd7f32" fill="#cd7f32"/>
            <path d="M12 16V20" stroke="#cd7f32"/>
            <path d="M8 21H16" stroke="#cd7f32"/>
          </svg>
          <div class="achievement-name">Novato</div>
          <div class="achievement-req">10 clics</div>
        </div>

        <!-- 100 Clicks Achievement -->
        <div class="achievement-card" id="achievement-100" data-clicks="100" aria-label="Logro 100 Clicks">
          <svg class="trophy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9C6 9 3 9 3 6C3 3 6 3 6 3H18C18 3 21 3 21 6C21 9 18 9 18 9" stroke="#c0c0c0" fill="#c0c0c0" fill-opacity="0.3"/>
            <path d="M6 3H18V10C18 13.3137 15.3137 16 12 16C8.68629 16 6 13.3137 6 10V3Z" stroke="#c0c0c0" fill="#c0c0c0"/>
            <path d="M12 16V20" stroke="#c0c0c0"/>
            <path d="M8 21H16" stroke="#c0c0c0"/>
          </svg>
          <div class="achievement-name">Experto</div>
          <div class="achievement-req">100 clics</div>
        </div>

        <!-- 1000 Clicks Achievement -->
        <div class="achievement-card" id="achievement-1000" data-clicks="1000" aria-label="Logro 1000 Clicks">
          <svg class="trophy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9C6 9 3 9 3 6C3 3 6 3 6 3H18C18 3 21 3 21 6C21 9 18 9 18 9" stroke="#ffd700" fill="#ffd700" fill-opacity="0.3"/>
            <path d="M6 3H18V10C18 13.3137 15.3137 16 12 16C8.68629 16 6 13.3137 6 10V3Z" stroke="#ffd700" fill="#ffd700"/>
            <path d="M12 16V20" stroke="#ffd700"/>
            <path d="M8 21H16" stroke="#ffd700"/>
          </svg>
          <div class="achievement-name">Maestro</div>
          <div class="achievement-req">1000 clics</div>
        </div>

      </div>
    </div>
  </div>

  <!-- Toast notification element for newly unlocked achievement -->
  <div class="toast-notification" id="achievement-toast" role="status" aria-live="polite">
    <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#ffd700" stroke-width="2">
      <path d="M6 3H18V10C18 13.3137 15.3137 16 12 16C8.68629 16 6 13.3137 6 10V3Z" fill="#ffd700"/>
      <path d="M12 16V20"/>
      <path d="M8 21H16"/>
    </svg>
    <div>
      <div style="font-weight: bold; font-size: 0.9rem; color: #ffd700;">¡Logro Desbloqueado!</div>
      <div id="toast-title" style="font-size: 0.8rem;"></div>
    </div>
  </div>

  <script>
    // Prevent right-click context menu
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    // Block common DevTools keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      // F12
      if (e.key === 'F12') {
        e.preventDefault();
        return;
      }
      // Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C, Ctrl+U (and Mac equivalents with Meta)
      const isCmdOrCtrl = e.ctrlKey || e.metaKey;
      if (
        (isCmdOrCtrl && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
        (isCmdOrCtrl && (e.key === 'U' || e.key === 'u'))
      ) {
        e.preventDefault();
        return;
      }
    });

    const cookieBtn = document.getElementById('cookie-btn');
    const cookieCountDisplay = document.getElementById('cookie-count');
    const resetBtn = document.getElementById('reset-btn');
    const toast = document.getElementById('achievement-toast');
    const toastTitle = document.getElementById('toast-title');

    const achievements = [
      { id: '10', threshold: 10, title: 'Novato (10 clics)' },
      { id: '100', threshold: 100, title: 'Experto (100 clics)' },
      { id: '1000', threshold: 1000, title: 'Maestro (1000 clics)' }
    ];

    const SECRET_SALT = 'CookieClicker_SecureSalt_987654321';

    function computeHash(value) {
      let str = value + SECRET_SALT;
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash |= 0; // Convert to 32bit integer
      }
      return hash.toString(16);
    }

    function getCookie(name) {
      const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? match[2] : null;
    }

    function setCookie(name, value) {
      document.cookie = `${name}=${value}; path=/; SameSite=Strict`;
    }

    function loadSavedCount() {
      const savedCountStr = localStorage.getItem('cookieClickCount') || getCookie('cookieClickCount');
      const savedHash = localStorage.getItem('cookieClickHash') || getCookie('cookieClickHash');

      if (!savedCountStr) return 0;

      const parsedCount = parseInt(savedCountStr, 10);
      if (isNaN(parsedCount) || parsedCount < 0) {
        return 0;
      }

      // Check integrity hash
      if (savedHash !== computeHash(parsedCount)) {
        console.warn('Tampering detected in saved state. Counter has been reset.');
        return 0;
      }

      return parsedCount;
    }

    function saveCount(val) {
      const hash = computeHash(val);
      localStorage.setItem('cookieClickCount', val);
      localStorage.setItem('cookieClickHash', hash);
      setCookie('cookieClickCount', val);
      setCookie('cookieClickHash', hash);
    }

    // Load saved count from localStorage or cookies with integrity check
    let count = loadSavedCount();
    let unlockedAchievements = JSON.parse(localStorage.getItem('cookieAchievements')) || {};
    cookieCountDisplay.textContent = count;
    saveCount(count);

    let toastTimeout = null;

    function showToast(title) {
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTitle.textContent = title;
      toast.classList.add('show');
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    function checkAchievements(currentCount, triggerToast = true) {
      achievements.forEach(ach => {
        const card = document.getElementById(`achievement-${ach.id}`);
        if (currentCount >= ach.threshold) {
          if (!unlockedAchievements[ach.id]) {
            unlockedAchievements[ach.id] = true;
            localStorage.setItem('cookieAchievements', JSON.stringify(unlockedAchievements));
            if (triggerToast) {
              showToast(ach.title);
            }
          }
          if (card) {
            card.classList.add('unlocked');
          }
        } else {
          if (card) {
            card.classList.remove('unlocked');
          }
        }
      });
    }

    // Initialize achievements UI on page load
    checkAchievements(count, false);

    function incrementCounter(event) {
      count++;
      cookieCountDisplay.textContent = count;
      saveCount(count);

      checkAchievements(count, true);

      // Create floating +1 text
      createFloatingText(event);
    }

    function createFloatingText(event) {
      const floatText = document.createElement('div');
      floatText.className = 'floating-text';
      floatText.textContent = '+1';

      const rect = cookieBtn.getBoundingClientRect();
      let x, y;

      if (event && event.clientX && event.clientY) {
        x = event.clientX - rect.left - 10;
        y = event.clientY - rect.top - 20;
      } else {
        // Fallback for keyboard press
        x = rect.width / 2 - 10;
        y = rect.height / 2 - 20;
      }

      floatText.style.left = `${x}px`;
      floatText.style.top = `${y}px`;

      cookieBtn.appendChild(floatText);

      setTimeout(() => {
        floatText.remove();
      }, 800);
    }

    cookieBtn.addEventListener('click', incrementCounter);

    cookieBtn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        incrementCounter(e);
      }
    });

    resetBtn.addEventListener('click', () => {
      count = 0;
      unlockedAchievements = {};
      cookieCountDisplay.textContent = count;
      saveCount(count);
      localStorage.setItem('cookieAchievements', JSON.stringify(unlockedAchievements));
      checkAchievements(count, false);
      if (toast) {
        toast.classList.remove('show');
      }
    });
  </script>
</body>
</html>
